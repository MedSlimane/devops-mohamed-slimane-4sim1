apiVersion: v1
kind: ConfigMap
metadata:
  name: student-management-config
  namespace: student-management
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/studentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: root
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_SHOW_SQL: "true"
  SERVER_PORT: "8089"
  SERVER_SERVLET_CONTEXT_PATH: /student
